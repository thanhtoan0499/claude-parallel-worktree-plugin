  /* ============================================================================
     Sổ trực — the manager keeps a running ledger; the CTO countersigns a few lines.
     Two rules hold the page together:

       1. MONO IS THE INSTRUMENT VOICE. Labels, pills, counts, identifiers and table headers
          are set in JetBrains Mono; prose a person reads — questions, titles, chat, notes —
          is Be Vietnam Pro. Both faces are self-hosted with the Vietnamese subset, so a
          diacritic renders correctly in either; the split is editorial, not a workaround.
       2. TWO PENCILS, ONE MEANING EACH. --red is the CTO's: it appears only where a human
          decision is required. --blue is the manager's: it appears only where the manager has
          flagged something it is already chasing. Late is blue, not amber, because a late
          assignment is the manager's job to chase, not the CTO's to decide. Nothing else on
          the page carries a hue.

     Sans tops out at 700 — that is every weight the self-hosted subset ships.
     ============================================================================ */
  :root {
    --paper:     #E7E9EA;   /* drafting stock */
    --leaf:      #F8F9F9;   /* the ledger leaf */
    --rule:      #D3D7D8;
    --rule-soft: #E4E7E8;
    --ink:       #15181B;
    --ink-soft:  #5C6469;
    --faint:     #8B9296;

    --red:  #A6322A;   /* the CTO must act — nowhere else */
    --blue: #2C5578;   /* the manager flagged it — nowhere else */

    --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --gutter: 12px;
    --pad: 22px;
    --shadow: 0 1px 2px rgba(21,24,27,.05);

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; display: flex; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- topbar + status strip ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; gap: 22px; padding: 13px 26px; flex-wrap: wrap;
    border-bottom: 1px solid var(--rule); background: var(--leaf);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--leaf); flex-shrink: 0;
    display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 15px;
  }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .brand p  { margin: 1px 0 0; font-size: 12px; color: var(--ink-soft); }
  .topbar-spacer { flex: 1; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--rule-soft); color: var(--ink-soft);
    display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700; flex-shrink: 0;
  }

  /* The four numbers that used to be four cards of zeros. One line, always in view because the
     topbar doesn't scroll. Zero and unknown recede; only "chờ bạn" is allowed to shout. */
  .strip { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .strip-item { display: flex; align-items: baseline; gap: 6px; font-family: var(--mono);
                font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .strip-item + .strip-item::before { content: "·"; color: var(--faint); margin-right: 10px; }
  .strip-n { font-size: 14px; font-weight: 700; color: var(--ink); text-transform: none; letter-spacing: 0; }
  .strip-item.zero, .strip-item.unknown { color: var(--faint); }
  .strip-item.zero .strip-n, .strip-item.unknown .strip-n { font-weight: 400; color: var(--faint); }
  .strip-item.on-red .strip-n  { color: var(--red);  font-size: 17px; }
  .strip-item.on-red           { color: var(--red);  font-weight: 700; }
  .strip-item.on-blue .strip-n { color: var(--blue); }
  .strip-item.on-blue          { color: var(--blue); }

  /* Below this the four numbers already fill the bar; the spacer would only push the avatar
     onto a line of its own. */
  @media (max-width: 900px) { .topbar-spacer { display: none; } }

  #content { flex: 1; overflow-y: auto; padding: 20px 26px 32px; }

  /* ---------- the ledger ---------- */
  .manager-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 400px); gap: 18px; align-items: start; }
  .manager-col-side { position: sticky; top: 0; max-height: calc(100dvh - 92px); display: flex; flex-direction: column; }
  @media (max-width: 1080px) { .manager-grid { grid-template-columns: minmax(0, 1fr); } .manager-col-side { position: static; max-height: 70dvh; } }

  .panel { background: var(--leaf); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }

  /* The signature: a margin gutter down the left edge of every ledger zone. It is a flat
     hairline rule by default; when a decision is waiting, that zone's gutter fills red and picks
     up pencil hatching — texture as well as hue, so it survives greyscale and colour-blindness.
     This is the page's only animation. */
  .zone { position: relative; padding-left: var(--gutter); }
  .zone + .zone { border-top: 1px solid var(--rule); }
  .zone::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--gutter);
    background-color: var(--rule-soft); border-right: 1px solid var(--rule);
    transition: background-color .4s ease, border-color .4s ease;
  }
  #decisions.has-signal::before {
    background-color: var(--red); border-right-color: var(--red);
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.40) 0 2px, transparent 2px 7px);
  }
  @media (prefers-reduced-motion: reduce) { .zone::before { transition: none; } }

  .zone-head { display: flex; align-items: baseline; gap: 10px; padding: 17px var(--pad) 12px; }
  .zone-head h2 { margin: 0; font-family: var(--mono); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink); }
  .zone-head .hint { font-size: 12px; color: var(--faint); }
  #decisions.has-signal .zone-head h2 { color: var(--red); }
  .zone > p { margin: 0; padding: 0 var(--pad) 20px; font-size: 13px; color: var(--ink-soft); }

  /* ---------- decisions ---------- */
  .decision { padding: 16px var(--pad) 18px; border-top: 1px solid var(--rule-soft); }
  .zone-head + .decision { border-top: 0; }
  .chat-prefs { display: flex; align-items: center; gap: 7px; padding: 0 var(--pad) 11px; flex-wrap: wrap; }
  .chat-prefs select { font-family: var(--sans); font-size: 12px; color: var(--ink); background: var(--leaf);
                       border: 1px solid var(--rule); border-radius: 5px; padding: 3px 6px; }
  .chat-prefs select:hover { border-color: var(--ink-soft); }
  .chat-prefs-note { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .decision-meta { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 7px; }
  .decision-age { font-family: var(--mono); font-size: 11px; color: var(--faint);
                  font-variant-numeric: tabular-nums; margin-left: auto; }
  .decision-age.over { color: var(--red); font-weight: 700; }
  .decision-q { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .decision-why { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; line-height: 1.5; }
  .decision-actions { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
  .decision-actions .btn { border-color: var(--red); color: var(--red); font-weight: 600; }
  .decision-actions .btn:hover { background: var(--red); color: var(--leaf); }
  /* The bulk-dismiss action lives in the zone header, not on a card — same --red as the
     per-card actions above (still a CTO decision, just made once for the whole group), no
     third colour. margin-left pins it to the end of the header row. */
  #decisions .zone-head .btn { border-color: var(--red); color: var(--red); font-weight: 600; margin-left: auto; }
  #decisions .zone-head .btn:hover { background: var(--red); color: var(--leaf); }

  /* ---------- assignments ---------- */
  .assign { padding: 16px var(--pad) 18px; border-top: 1px solid var(--rule-soft); }
  .zone-head + .assign { border-top: 0; }
  .assign-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .assign-title { font-size: 14.5px; font-weight: 600; flex: 1; min-width: 140px; line-height: 1.35; }
  .assign-refs { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 20px; margin-top: 7px;
                 font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }
  .assign-refs .ref-pair { display: flex; align-items: baseline; gap: 7px; }
  .assign-refs a { color: var(--ink-soft); text-decoration: underline;
                   text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .assign-refs a:hover { color: var(--ink); text-decoration-color: var(--ink); }
  .assign-refs .ref-none, .assign-refs .ref-state { color: var(--faint); }
  .assign-refs .ref-state.on-red { color: var(--red); font-weight: 700; }
  .assign-progress { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
  .bar { width: 150px; height: 3px; background: var(--rule); overflow: hidden; border-radius: 2px; flex-shrink: 0; }
  .bar-fill { height: 100%; background: var(--ink); }
  .assign-meta { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .02em; }
  .assign-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 9px; line-height: 1.5; }
  .step { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
          padding: 6px 0 6px 12px; margin-top: 3px; font-size: 12.5px; border-left: 2px solid var(--rule); }
  .step-done .step-name { color: var(--faint); text-decoration: line-through; }
  .step-doing { border-left-color: var(--ink); }
  .step-doing .step-name { font-weight: 600; }
  .step .step-meta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }

  /* ---------- pills: instrument labels, grey unless a pencil applies ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 5px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
    background: var(--rule-soft); color: var(--ink-soft); border: 1px solid transparent; white-space: nowrap;
  }
  .pill.on-ink  { background: var(--rule); color: var(--ink); font-weight: 700; }
  .pill.on-line { background: transparent; color: var(--ink-soft); border-color: var(--rule); }
  .pill.on-red  { background: transparent; color: var(--red);  border-color: var(--red);  font-weight: 700; }
  .pill.on-blue { background: transparent; color: var(--blue); border-color: var(--blue); }

  /* ---------- backlog: reference weight. It is not the CTO's queue, so it never competes
     with the two zones above it. ---------- */
  .ticket-filters { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
                    padding: 0 var(--pad) 12px; }
  .ticket-filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint);
                          font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
  .ticket-filters select, .ticket-filters button {
    font-family: var(--sans); font-size: 12.5px; color: var(--ink); background: var(--leaf);
    border: 1px solid var(--rule); border-radius: 5px; padding: 4px 8px; text-transform: none;
    letter-spacing: normal; }
  .ticket-filters button { cursor: pointer; }
  .ticket-filters button:hover, .ticket-filters select:hover { border-color: var(--ink-soft); }
  .ticket-count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--faint);
                  font-variant-numeric: tabular-nums; }
  .ticket-sprint { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .ticket-row { display: grid; grid-template-columns: minmax(0, 1fr) 210px 136px; align-items: baseline;
                gap: 12px; padding: 10px var(--pad); border-top: 1px solid var(--rule-soft); }
  .ticket-states { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; justify-self: start; }
  /* The PR chip carries its own state, so it is a chip and not another bare id link. Merged
     and closed are past tense and stay quiet; only a PR still waiting on someone is outlined. */
  .ticket-pr { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .04em;
               padding: 2px 7px; border-radius: 5px; text-decoration: none; white-space: nowrap;
               flex-shrink: 0; background: var(--rule-soft); color: var(--ink-soft);
               border: 1px solid transparent; }
  .ticket-pr:hover { color: var(--ink); }
  .ticket-pr.pr-open { background: transparent; border-color: var(--rule); color: var(--ink); font-weight: 700; }
  .ticket-done { border-top: 1px solid var(--rule-soft); }
  .ticket-done > summary { display: flex; align-items: center; gap: 9px; cursor: pointer;
                           padding: 10px var(--pad); list-style: none; }
  .ticket-done > summary::-webkit-details-marker { display: none; }
  .ticket-done > summary::after { content: ""; width: 6px; height: 6px; margin-left: auto;
                                  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
                                  transform: rotate(45deg); transition: transform .15s ease; }
  .ticket-done[open] > summary::after { transform: rotate(-135deg); }
  .ticket-done > summary:hover { background: var(--rule-soft); }
  .ticket-done .done-hint { font-size: 12px; color: var(--faint); }
  @media (prefers-reduced-motion: reduce) { .ticket-done > summary::after { transition: none; } }
  .zone-head + .ticket-row, #tickets > .ticket-row:first-child { border-top: 0; }
  .ticket-left { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .ticket-id { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--ink-soft); text-decoration: none; flex-shrink: 0; }
  .ticket-id:hover { color: var(--ink); text-decoration: underline; }
  .ticket-title { font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket-action { justify-self: end; text-align: right; font-size: 12.5px; color: var(--ink-soft);
                   text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px;
                   white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
                   background: none; border: 0; padding: 0; font-family: var(--sans); cursor: pointer; }
  .ticket-action:hover { color: var(--ink); text-decoration-color: var(--ink); }
  .ticket-action.muted { color: var(--faint); cursor: default; text-decoration: none; }
  .ticket-action.muted:hover { color: var(--faint); }

  .dispatch-form { padding: 13px var(--pad) 16px; border-top: 1px solid var(--rule-soft); background: var(--paper); display: flex; flex-direction: column; gap: 9px; }
  .dispatch-hint { font-size: 12px; color: var(--ink-soft); }
  .dispatch-bundle { display: flex; flex-direction: column; gap: 5px; }
  .dispatch-bundle-item { font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
  .dispatch-actions { display: flex; gap: 8px; }
  .dispatch-status { font-size: 12.5px; color: var(--red); font-weight: 600; }

  /* ---------- controls ---------- */
  textarea, input[type=text] { font-family: var(--sans); color: var(--ink); }
  .dispatch-instructions, .chat-input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 7px;
    background: var(--leaf); font-size: 13px; line-height: 1.5; resize: vertical;
  }
  .dispatch-instructions { min-height: 60px; }
  .chat-input:focus, .dispatch-instructions:focus { outline: none; border-color: var(--ink); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--rule); background: var(--leaf); color: var(--ink);
    font-size: 12.5px; font-weight: 500; font-family: var(--sans); cursor: pointer; text-decoration: none;
    transition: border-color .12s, background .12s, color .12s;
  }
  .btn:hover { border-color: var(--ink-soft); background: var(--paper); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--leaf); font-weight: 600; }
  .btn.primary:hover { background: #000; border-color: #000; color: var(--leaf); }
  .btn.quiet { border-color: transparent; color: var(--ink-soft); padding: 4px 8px; font-size: 12px; }
  .btn.quiet:hover { border-color: var(--rule); background: var(--paper); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- manager transcript: a record, not a chat app. Speaker tag above the words, both
     flush left, so the CTO's own line and the manager's read as one column. ---------- */
  .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px var(--pad) 11px; }
  .chat-head h2 { margin: 0; font-family: var(--mono); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .chat-log { flex: 1; min-height: 200px; overflow-y: auto; padding: 14px var(--pad); border-top: 1px solid var(--rule);
              display: flex; flex-direction: column; gap: 16px; }
  .chat-log:has(> .empty) { justify-content: center; }
  .chat-compose { display: flex; gap: 8px; align-items: flex-end; padding: 12px var(--pad); border-top: 1px solid var(--rule); background: var(--paper); }
  .chat-compose .chat-input { flex: 1; }

  .msg { display: flex; flex-direction: column; gap: 4px; }
  .msg-who { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .msg-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg-cto .msg-who { color: var(--ink); }
  .msg-cto .msg-text { color: var(--ink-soft); }
  /* Proactive work — anything the manager did without being asked — carries the same margin
     grammar as the ledger, one step quieter: an ink rule instead of a red gutter. */
  .msg-auto { border-left: 2px solid var(--rule); padding-left: 12px; }
  .msg-thinking { color: var(--faint); font-style: italic; font-size: 12.5px; }
  .msg-error .msg-text { color: var(--red); font-weight: 500; }

  .empty { padding: 28px var(--pad); text-align: center; color: var(--faint); font-size: 13px; }
  .empty.err { color: var(--red); font-weight: 500; }
  /* One malformed record inside an otherwise-good list — cardOrError()'s fallback row. Same
     ".err" meaning as .empty.err above, just on a card that keeps its own box (padding/rule)
     instead of the centred full-panel layout. No new colour: reuses --red. */
  .decision.err, .assign.err { color: var(--red); font-weight: 500; }
  svg { display: block; }
</style>
</head>
<body>

<div id="main">
  <header id="topbar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>Engineering Manager</h1>
        <p id="repo-label">Điều phối các phiên chạy song song</p>
      </div>
    </div>
    <div id="counters" class="strip" aria-label="Tổng quan"></div>
    <div class="topbar-spacer"></div>
    <div class="avatar">AQ</div>
  </header>

  <main id="content">
    <div id="manager-grid" class="manager-grid">
      <div class="manager-col-main">
        <div class="panel">
          <section id="decisions" class="zone"></section>
          <section id="assignments" class="zone"></section>
          <section id="ado" class="zone">
            <div class="zone-head">
              <h2>Backlog ADO</h2>
              <span class="hint">chỉ để tham khảo — giao một kết quả, không phải một vé</span>
            </div>
            <div class="ticket-filters">
              <label>Sprint
                <select id="f-sprint"><option value="">tất cả</option></select>
              </label>
              <label>Trạng thái
                <select id="f-state"><option value="">tất cả</option></select>
              </label>
              <button type="button" id="f-sort" data-sort="status">Sắp theo: việc cần làm trước</button>
              <span class="ticket-count" id="f-count"></span>
            </div>
            <div id="tickets"></div>
          </section>
        </div>
      </div>
      <aside id="manager-chat" class="panel manager-col-side"></aside>
    </div>

  </main>
</div>

<script>
let lastData = [];
let lastEscalations = { needs_human: [], recent_decisions: [] };
let lastUndeliverableIds = [];  // recomputed every renderDecisions() call; the bulk-dismiss
                                 // button reads it fresh at click time, never more than one
                                 // poll tick stale.
let lastAdoTickets = [];
let lastAssignments = [];
let pollFailures = { assignments: false, escalations: false, chat: false }; // which source is
                                                                // currently stale — renderCounters
                                                                // reads assignments/escalations for
                                                                // "—" instead of a false zero; chat
                                                                // has no counter, so pollChat renders
                                                                // its own honest error state instead.
let tasksFailed = false; // true while /api/tasks is failing — session state is unknown, so
function checkResponse(res, data) {
  if (res.ok && !data.error) return null;
  return data.error || ("HTTP " + res.status);
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // textContent everywhere: names never parse as HTML
  return n;
}
// ref.url (ado_refs[].url, from assignments.jsonl) is model/worker-authored — dashboard.py's own
// _parse_ado_refs allowlists http(s) on the POST path, but the manager also writes ledger records
// straight through assignments.append(rec) with no validation at all, so this page has no CSP and
// must not trust the value at the sink either. "" (never trusted) falls through to the caller's
// own "#" fallback, exactly like a url that was absent entirely.
function safeHref(url) {
  return /^https?:\/\//i.test(url || "") ? url : "";
}
// tone is one of "" (grey) | on-line | on-ink | on-red | on-blue — see the two-pencil rule at
// the top of the stylesheet.
function pill(tone, label) {
  const p = el("span", "pill" + (tone ? " " + tone : ""));
  p.append(document.createTextNode(label));
  return p;
}

// Every row in a map()-into-replaceChildren list is built from model/worker-authored data —
// one record with an unexpected shape must yield one honest row, never blank every row after
// it. `cls` is the caller's card class (e.g. "decision", "assign") so the error row still picks
// up that card's own box rhythm (padding, top rule); ".err" is the same modifier `.empty.err`
// already uses for "this failed" text, so no new colour is introduced.
function cardOrError(rec, build, cls) {
  try {
    return build(rec);
  } catch (e) {
    const id = (rec && rec.id) || "?";
    return el("div", cls + " err", `Không hiển thị được bản ghi ${id}: ${e.message || e}`);
  }
}

// One row per ticket in the manager's ADO backlog, not per session — a ticket with no
// dispatched session yet still shows up as "Not started" so it's a click away from being one.
const TICKET_STATUS_LABEL = {
  done: "xong", decision: "cần bạn quyết", blocked: "bị chặn",
  progress: "đang làm", "not-started": "chưa bắt đầu",
  stalled: "đứng im",
};
const TICKET_STATUS_TONE = {
  decision: "on-red", blocked: "on-ink", stalled: "on-ink", progress: "on-line",
};
// ADO's own state, in ADO's own words. Only a state that still owes someone work gets a
// pencil: Resolved is outlined because it is waiting on QC, Active because it is waiting on
// a review. New and Closed owe nobody anything right now and stay grey.
const ADO_STATE_TONE = { Resolved: "on-line", Active: "on-ink", Blocked: "on-red" };
// A ticket is "not done" while ADO still has it open, whatever the session layer thinks.
const TICKET_DONE_STATES = ["Closed", "Removed", "Done"];
function ticketIsDone(r) { return TICKET_DONE_STATES.indexOf(r.adoState) > -1; }

function computeTickets(adoTickets, tasks, esc) {
  const escBySession = {};
  (esc.needs_human || []).forEach(e => { if (e.session_id) escBySession[e.session_id] = e; });

  const rows = [];
  for (const ticket of adoTickets) {
    const matched = tasks.filter(t => (t.ado_refs || []).some(r => r.id === ticket.id));
    const pendingEsc = matched.map(t => escBySession[t.session_id]).find(Boolean);
    const withPr = matched.find(t => t.pr_url) || matched[0];

    let status, action, actionHref = null;
    if (pendingEsc) {
      status = "decision"; action = pendingEsc.question || "Cần một quyết định";
    } else if (matched.some(t => stateOf(t) === "blocked")) {
      status = "blocked"; action = "Xem vướng ở đâu";
    } else if (matched.length && matched.every(t => t.kind === null) && !matched.some(t => t.pr_url)) {
      status = "stalled"; action = "Giao lại việc";
    } else if (!matched.length) {
      status = "not-started"; action = "Giao việc";
    } else if (withPr && withPr.pr_state === "MERGED") {
      status = "done"; action = "—";
    } else if (withPr && withPr.pr_state === "OPEN") {
      status = "progress"; action = "Duyệt PR #" + withPr.pr_number; actionHref = withPr.pr_url;
    } else {
      status = "progress"; action = "—";
    }

    rows.push({
      id: ticket.id,
      label: "AB#" + ticket.id,
      href: ticket.url,
      title: ticket.title,
      // The board's OWN word for this ticket. Everything else on the row is derived from
      // sessions and PRs; this is what a manager sees in ADO, so it must survive unedited —
      // a derived "xong" over a ticket ADO still calls Resolved is the disagreement worth
      // showing, not hiding.
      adoState: ticket.state || "",
      sprint: ticket.sprint || "",
      prLabel: withPr && withPr.pr_number ? "PR #" + withPr.pr_number : null,
      prHref: withPr ? withPr.pr_url : null,
      prState: withPr ? withPr.pr_state : null,
      status, action, actionHref,
    });
  }
  const rank = { decision: 0, blocked: 1, stalled: 2, "not-started": 3, progress: 4, done: 5 };
  rows.sort((a, b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9));
  return rows;
}

// Filter + sort state. Held here, not read off the DOM, so a poll tick that rebuilds the rows
// cannot silently drop what the user picked.
const ticketView = { sprint: "", state: "", sort: "status" };
const TICKET_SORTS = {
  status: "việc cần làm trước",
  "id-desc": "số ticket, mới nhất",
  "id-asc": "số ticket, cũ nhất",
};

function applyTicketView(rows) {
  let out = rows.filter(r =>
    (!ticketView.sprint || r.sprint === ticketView.sprint) &&
    (!ticketView.state || r.adoState === ticketView.state));
  if (ticketView.sort !== "status") {
    // Numeric, not lexicographic: as strings "AB#900" sorts after "AB#8311".
    const dir = ticketView.sort === "id-asc" ? 1 : -1;
    out = out.slice().sort((a, b) => (Number(a.id) - Number(b.id)) * dir);
  }
  return out;
}

// Options come from the rows themselves, so a sprint nobody has a ticket in never appears.
// Newest sprint first, by the trailing number — "Sprint 58" above "Sprint 9", which plain
// string order gets backwards. Buckets with no number (Backlog, AgentIQ, Project-202610) are
// not sprints at all and sit together at the end, alphabetically.
function sprintOrder(name) {
  // The number must be its own word — "Sprint 57" and "Iteration 3" are numbered, while
  // "Project-202610" is a bucket whose name merely ends in digits and belongs with Backlog.
  const m = /(?:^|\s)(\d+)\s*$/.exec(name);
  return m ? Number(m[1]) : null;
}

function compareSprints(a, b) {
  const oa = sprintOrder(a);
  const ob = sprintOrder(b);
  if (oa === null && ob === null) return a.localeCompare(b);
  if (oa === null) return 1;
  if (ob === null) return -1;
  return ob - oa;
}

function syncTicketFilters(rows) {
  fillSelect("f-sprint", [...new Set(rows.map(r => r.sprint).filter(Boolean))].sort(compareSprints),
    ticketView.sprint);
  fillSelect("f-state", [...new Set(rows.map(r => r.adoState).filter(Boolean))].sort(),
    ticketView.state);
  const btn = document.getElementById("f-sort");
  if (btn) btn.textContent = "Sắp theo: " + TICKET_SORTS[ticketView.sort];
}

function fillSelect(id, values, current) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const wanted = ["", ...values];
  const have = [...sel.options].map(o => o.value);
  if (have.length !== wanted.length || have.some((v, i) => v !== wanted[i])) {
    sel.replaceChildren(...wanted.map(v => {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v || "tất cả";
      return o;
    }));
  }
  // A value that vanished from the data (last ticket in that sprint closed) must not leave the
  // list silently filtered to nothing — fall back to "tất cả" and clear the stored choice.
  if (current && !wanted.includes(current)) {
    sel.value = "";
    if (id === "f-sprint") ticketView.sprint = "";
    if (id === "f-state") ticketView.state = "";
  } else {
    sel.value = current;
  }
}

function wireTicketFilters() {
  const rerender = () => renderTickets(computeTickets(lastAdoTickets, lastData, lastEscalations));
  const sprint = document.getElementById("f-sprint");
  const state = document.getElementById("f-state");
  const sort = document.getElementById("f-sort");
  if (sprint) sprint.addEventListener("change", () => { ticketView.sprint = sprint.value; rerender(); });
  if (state) state.addEventListener("change", () => { ticketView.state = state.value; rerender(); });
  if (sort) sort.addEventListener("click", () => {
    const keys = Object.keys(TICKET_SORTS);
    ticketView.sort = keys[(keys.indexOf(ticketView.sort) + 1) % keys.length];
    rerender();
  });
}

function renderTickets(rows) {
  const box = document.getElementById("tickets");
  if (tasksFailed) {
    // Session state is unknown right now — every ticket would otherwise fall back to
    // "not-started" with a live dispatch button, risking a duplicate dispatch onto a ticket
    // that already has a session running. Show the warning and nothing else.
    box.replaceChildren(el("div", "empty err",
      "Không xác nhận được phiên nào đang chạy — trạng thái ticket có thể đã cũ. " +
      "Tạm khoá việc giao cho tới khi đọc lại được."));
    return;
  }
  // ponytail: a 2s/5s poll tick would otherwise wipe an in-progress dispatch form (and
  // whatever the user typed) out from under them; skip this re-render while one is open and
  // let the next tick after it closes pick up any changes.
  if (document.querySelector("#tickets .dispatch-form")) return;
  if (!rows.length) {
    box.replaceChildren(el("div", "empty", "Chưa có ticket nào."));
    return;
  }
  syncTicketFilters(rows);
  const visible = applyTicketView(rows);
  const count = document.getElementById("f-count");
  if (count) {
    count.textContent = visible.length === rows.length
      ? `${rows.length} ticket`
      : `${visible.length} / ${rows.length} ticket`;
  }

  const frag = document.createDocumentFragment();
  const open = visible.filter(r => !ticketIsDone(r));
  const done = visible.filter(ticketIsDone);

  open.forEach(r => frag.append(ticketRow(r)));
  if (!open.length) {
    frag.append(el("div", "empty", done.length
      ? "Không còn ticket nào đang mở."
      : "Không có ticket nào khớp bộ lọc."));
  }

  if (done.length) {
    const box2 = el("details", "ticket-done");
    const sum = el("summary");
    sum.append(pill("", "xong · " + done.length),
               el("span", "done-hint", "đóng trong 14 ngày qua"));
    box2.append(sum);
    done.forEach(r => box2.append(ticketRow(r)));
    frag.append(box2);
  }
  box.replaceChildren(frag);
}

// One backlog row. Reads left to right the way the question is actually asked: which ticket,
// where does it live, what does ADO call it, what happened to its PR, what do I do next.
function ticketRow(r) {
  const row = el("div", "ticket-row");
  const left = el("div", "ticket-left");
  const idLink = el("a", "ticket-id", r.label);
  idLink.href = safeHref(r.href) || "#"; idLink.target = "_blank"; idLink.rel = "noopener";
  left.append(idLink);
  if (r.prLabel) {
    const prLink = el("a", "ticket-pr" + (r.prState ? " pr-" + r.prState.toLowerCase() : ""),
                      PR_STATE_LABEL[r.prState] ? r.prLabel + " · " + PR_STATE_LABEL[r.prState] : r.prLabel);
    prLink.href = safeHref(r.prHref) || "#"; prLink.target = "_blank"; prLink.rel = "noopener";
    left.append(prLink);
  }
  left.append(el("span", "ticket-title", r.title || ""));

  const states = el("div", "ticket-states");
  if (r.sprint) states.append(el("span", "ticket-sprint", r.sprint));
  if (r.adoState) states.append(pill(ADO_STATE_TONE[r.adoState] || "", r.adoState));
  // Once ADO calls a ticket done, the derived status has nothing left to add — it is computed
  // from sessions and PRs, which keep moving after a ticket closes, so it reads as a live
  // "đang làm" on work that is over. ADO's word is the only one that matters here.
  if (!ticketIsDone(r)) {
    states.append(pill(TICKET_STATUS_TONE[r.status] || "", TICKET_STATUS_LABEL[r.status] || r.status));
  }
  row.append(left, states);

  if (r.status === "not-started" || r.status === "stalled") {
    const btn = el("button", "ticket-action", r.status === "stalled" ? "Giao lại ›" : "Giao việc ›");
    btn.onclick = () => openDispatchForm(row, r);
    row.append(btn);
  } else if (r.actionHref) {
    const a = el("a", "ticket-action", r.action);
    a.href = safeHref(r.actionHref) || "#"; a.target = "_blank"; a.rel = "noopener";
    row.append(a);
  } else {
    row.append(el("span", "ticket-action" + (r.action === "—" ? " muted" : ""), r.action));
  }
  return row;
}

function openDispatchForm(rowEl, ticket) {
  if (rowEl.nextSibling && rowEl.nextSibling.classList && rowEl.nextSibling.classList.contains("dispatch-form")) {
    rowEl.nextSibling.remove();
    return; // toggle closed if already open
  }
  const bundleCandidates = computeTickets(lastAdoTickets, lastData, lastEscalations)
    .filter(r => r.status === "not-started" && r.id !== ticket.id);

  const form = el("div", "dispatch-form");
  const checks = el("div", "dispatch-bundle");
  const checkboxByIds = {};
  bundleCandidates.forEach(c => {
    const label = el("label", "dispatch-bundle-item");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.value = c.id;
    checkboxByIds[c.id] = cb;
    label.append(cb, document.createTextNode(" " + c.label + " — " + c.title));
    checks.append(label);
  });
  if (bundleCandidates.length) form.append(el("div", "dispatch-hint", "Gộp thêm ticket chưa bắt đầu:"), checks);

  const textarea = document.createElement("textarea");
  textarea.className = "dispatch-instructions";
  textarea.placeholder = "Ghi chú thêm (không bắt buộc)";
  form.append(textarea);

  const status = el("div", "dispatch-status");
  const actions = el("div", "dispatch-actions");
  const confirmBtn = el("button", "btn primary", "Xác nhận & giao");
  const cancelBtn = el("button", "btn", "Hủy");
  cancelBtn.onclick = () => form.remove();
  confirmBtn.onclick = async () => {
    const bundledIds = Object.keys(checkboxByIds).filter(id => checkboxByIds[id].checked);
    const bundled = [ticket, ...bundleCandidates.filter(c => bundledIds.includes(c.id))];
    const instructions = textarea.value.trim();
    const title = ticket.title + (instructions ? ` — ${instructions}` : "");
    confirmBtn.disabled = true; confirmBtn.textContent = "Đang tạo…";
    status.textContent = "";
    try {
      const res = await fetch("/api/assignments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title,
          priority: "P1",
          deadline: null,
          ado_refs: bundled.map(t => ({ id: String(t.id), url: t.href })),
        }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
      form.remove();
      pollAssignments();
      if (data.warning) alert(data.warning);
    } catch (e) {
      status.textContent = "Lỗi: " + (e.message || e);
      confirmBtn.disabled = false; confirmBtn.textContent = "Xác nhận & giao";
    }
  };
  actions.append(confirmBtn, cancelBtn);
  form.append(actions, status);
  rowEl.after(form);
}

function stateOf(t) { return (t.agent_state || t.agent_status || "").toLowerCase(); }

async function pollTasks() {
  let data, err;
  try {
    const res = await fetch("/api/tasks");
    data = await res.json();
    err = checkResponse(res, data);
  } catch (e) { err = e.message || "request failed"; }

  if (err) {
    tasksFailed = true;
    renderTickets(computeTickets(lastAdoTickets, lastData, lastEscalations));
    return;
  }
  tasksFailed = false;
  lastData = data;
  renderTickets(computeTickets(lastAdoTickets, lastData, lastEscalations));
  renderAssignments(lastAssignments);
}

// tone ("on-red" | "on-blue" | null) picks which pencil a non-zero value is written in. A value
// that is "—" (unknown, a failed poll) or literally 0 never takes a pencil regardless of tone, so
// a stale fetch can never be mistaken for a real signal.
function stripItem(label, n, tone) {
  const unknown = n === "—";
  const zero = !unknown && Number(n) === 0;
  let cls = "strip-item";
  if (unknown) cls += " unknown";
  else if (zero) cls += " zero";
  else if (tone) cls += " " + tone;
  const item = el("div", cls);
  item.append(el("span", "strip-n", String(n)), el("span", null, label));
  return item;
}

// escalations here is the flat needs_human array — already the curated "needs a human" set from
// get_escalations() (see renderDecisions below), both callers pass lastEscalations.needs_human.
// failures marks which source is currently stale — that half of the row reads "—", never a false 0.
function renderCounters(assignments, escalations, failures) {
  const open = assignments.filter(a => !["done", "cancelled"].includes(a.status));
  const weekAgo = Date.now() / 1000 - 7 * 86400;
  const A = failures.assignments;
  const E = failures.escalations;
  const items = [
    ["chờ bạn", E ? "—" : String(escalations.length), "on-red"],
    ["đang giao", A ? "—" : String(open.length), null],
    ["trễ / đứng im", A ? "—" : String(open.filter(a => a.at_risk || a.stalled).length), "on-blue"],
    ["xong tuần này", A ? "—" : String(assignments.filter(a => a.status === "done" && (a.ts || 0) >= weekAgo).length), null],
  ];
  document.getElementById("counters").replaceChildren(...items.map(([label, n, tone]) => stripItem(label, n, tone)));
}

// A zone's title bar. Kept in one place so the three ledger zones can never drift apart.
function zoneHead(title, hint) {
  const head = el("div", "zone-head");
  head.append(el("h2", null, title));
  if (hint) head.append(el("span", "hint", hint));
  return head;
}

// Mirrors escalations.py's is_undeliverable(): a needs_human record that already carries a
// decided answer manager_daemon.py's _try_deliver could never carry back to its worker — not a
// genuine open question. Kept in lockstep with the Python predicate; see its docstring for why
// this exact trio is safe to trust without re-deriving anything server-side.
function isUndeliverable(rec) {
  return rec.status === "needs_human" && rec.answer != null && rec.delivery_attempts != null;
}

// How long the escalation has been sitting, and whether that is past the point where it stops
// being "recent" and starts being "nobody looked". A blocker 30 minutes old and one 3 days old
// are not the same item, and the card said nothing about which it was.
const ESCALATION_SLA_HOURS = 24;

function escalationAge(rec) {
  const ts = Number(rec.ts);
  if (!isFinite(ts) || ts <= 0) return null;
  // Records are written by time.time() — seconds. Guard anyway: a millisecond timestamp would
  // otherwise read as ~55 years old and paint every card red.
  const secs = (Date.now() / 1000) - (ts > 1e11 ? ts / 1000 : ts);
  if (secs < 0) return null;
  return secs / 3600;
}

function formatAge(hours) {
  if (hours < 1) return `${Math.max(1, Math.round(hours * 60))} phút`;
  if (hours < 48) return `${Math.round(hours)} giờ`;
  return `${Math.round(hours / 24)} ngày`;
}

// Severity, from what the record already says. `kind` is worker-authored and open-ended, so
// this reads as "which known kinds are urgent", never as a closed enum — an unknown kind is
// NOT quietly demoted, it keeps whatever the tier says.
const URGENT_KINDS = new Set(["credentials", "irreversible", "cost_anomaly", "push_or_pr"]);

function escalationSeverity(rec) {
  // kind_canonical, not kind: the raw value is whatever the worker typed, and a decorated
  // near-miss like "blocked_on_credentials" must score as the credentials outage it is.
  const kind = String(rec.kind_canonical || "");
  if (URGENT_KINDS.has(kind)) return { label: "P0", tone: "on-red" };
  if (rec.tier === "tier3" || !rec.tier) return { label: "P1", tone: "on-ink" };
  return { label: "P2", tone: "on-line" };
}

function decisionCard(rec) {
  const card = el("div", "decision");
  const sev = escalationSeverity(rec);
  const meta = el("div", "decision-meta");
  meta.append(pill(sev.tone, sev.label));
  if (rec.kind) {
    // Shown as written, and marked whenever it is not exactly a vocabulary name — whether it
    // matched nothing, or matched only after normalisation ("blocked_on_credentials"). Both are
    // drift; absorbing the second silently is how the vocabulary stops meaning anything.
    const drifted = rec.kind !== rec.kind_canonical;
    meta.append(pill(drifted ? "on-line" : "", String(rec.kind) + (drifted ? " ⚠" : "")));
  }
  const hours = escalationAge(rec);
  if (hours !== null) {
    const late = hours >= ESCALATION_SLA_HOURS;
    meta.append(el("span", "decision-age" + (late ? " over" : ""),
      `chờ ${formatAge(hours)}${late ? ` · quá ${ESCALATION_SLA_HOURS}h` : ""}`));
  }
  card.append(meta);
  if (isUndeliverable(rec)) {
    // The real situation, not the stale question: what was decided, and who never got it.
    card.append(el("div", "decision-q", `Trả lời "${rec.answer}" chưa tới được ${rec.session_id || "?"}`));
    card.append(el("div", "decision-why", rec.reason || ""));
    if (rec.question) {
      // Context, not a live choice — no options rendered as buttons below.
      card.append(el("div", "decision-why", `Câu hỏi gốc: ${rec.question}`));
    }
    const actions = el("div", "decision-actions");
    const btn = el("button", "btn", "Đóng");
    btn.onclick = () => dismissEscalation(rec.id);
    actions.append(btn);
    card.append(actions);
    return card;
  }
  card.append(el("div", "decision-q", rec.question || ""));
  card.append(el("div", "decision-why", rec.reason || ""));
  const actions = el("div", "decision-actions");
  (Array.isArray(rec.options) ? rec.options : []).forEach(opt => {
    const btn = el("button", "btn", opt);
    btn.onclick = () => answerEscalation(rec.id, opt);
    actions.append(btn);
  });
  card.append(actions);
  return card;
}

// The record already carries options, validate_decision already requires the answer to be one
// of them, and POST /api/escalations/<id>/answer already exists — one button per option.
//
// escalations is already the curated "needs a human" set get_escalations() (bin/dashboard.py)
// returns as needs_human: it folds in every tier-3 record WITHOUT rewriting that record's own
// status field, which stays "open" until manager_daemon.py's process_open() runs (and that daemon
// is optional — the README only starts dashboard.py). Re-filtering here by status === "needs_human"
// would throw those freshly-classified records right back out, permanently if the daemon never
// runs. Trust the array as given, same as computeTickets already does with this same field.
function renderDecisions(escalations) {
  const panel = document.getElementById("decisions");
  // The one place the page is allowed to shout: a pending decision colours its own zone's
  // rule so the eye lands here first, before it ever reaches the counters above.
  panel.classList.toggle("has-signal", escalations.length > 0);
  const head = zoneHead("Cần bạn quyết");
  // Every undeliverable record shares one cause (its worker session is gone) and one fix
  // (close it) — a group action beats N per-card clicks. Recomputed every render, so the count
  // in the label can never go stale by more than one poll tick; dismissAllUndeliverable() reads
  // this same array at click time rather than re-deriving it.
  lastUndeliverableIds = escalations.filter(isUndeliverable).map(r => r.id);
  if (lastUndeliverableIds.length) {
    const bulk = el("button", "btn", `Đóng ${lastUndeliverableIds.length} mục không gửi được`);
    bulk.onclick = dismissAllUndeliverable;
    head.append(bulk);
  }
  if (!escalations.length) {
    panel.replaceChildren(head, el("p", null, "Không có gì chờ bạn."));
    return;
  }
  panel.replaceChildren(head, ...escalations.map(rec => cardOrError(rec, decisionCard, "decision")));
}

async function answerEscalation(id, answer) {
  try {
    const res = await fetch(`/api/escalations/${encodeURIComponent(id)}/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer, decided_by: "cto" }),
    });
    if (!res.ok) { alert(`Không gửi được: ${res.status}`); return; }
    pollEscalations();
  } catch (e) {
    alert("Không gửi được: " + (e.message || e));
  }
}

// No "retry delivery" action here on purpose: the worker session behind an undeliverable record
// is gone, the daemon already gave it 3 tries (DELIVERY_ATTEMPTS in manager_daemon.py), and a
// retry button would just fail the same way. Closing it is the only action that makes sense today.
async function dismissEscalation(id) {
  try {
    const res = await fetch(`/api/escalations/${encodeURIComponent(id)}/dismiss`, { method: "POST" });
    if (!res.ok) { alert(`Không đóng được: ${res.status}`); return; }
    pollEscalations();
  } catch (e) {
    alert("Không đóng được: " + (e.message || e));
  }
}

async function dismissAllUndeliverable() {
  const ids = lastUndeliverableIds;
  if (!ids.length || !confirm(`Đóng ${ids.length} mục không gửi được?`)) return;
  let failed = 0;
  for (const id of ids) {
    const res = await fetch(`/api/escalations/${encodeURIComponent(id)}/dismiss`, { method: "POST" }).catch(() => null);
    if (!res || !res.ok) failed++;
  }
  if (failed) alert(`${failed}/${ids.length} không đóng được — thử lại.`);
  pollEscalations();
}

const PRIORITY_TONE = { P0: "on-ink", P1: "on-line" };
const ASSIGN_STATUS_LABEL = {
  assigned: "đã giao", in_progress: "đang làm", blocked: "bị chặn",
  done: "xong", cancelled: "đã huỷ",
};

const PR_STATE_LABEL = { OPEN: "đang mở", MERGED: "đã gộp", CLOSED: "đã đóng" };

function assignRefs(a, byTicket) {
  const refs = a.ado_refs || [];
  if (!refs.length) return null;
  const line = el("div", "assign-refs");
  refs.forEach(ref => {
    const row = byTicket[String(ref.id)];
    const pair = el("span", "ref-pair");
    const id = el("a", null, "AB#" + ref.id);
    id.href = (row && row.href) || safeHref(ref.url) || "#"; id.target = "_blank"; id.rel = "noopener";
    pair.append(id);
    if (row && TICKET_STATUS_LABEL[row.status]) {
      pair.append(el("span", "ref-state" + (row.status === "decision" ? " on-red" : ""),
                     `(${TICKET_STATUS_LABEL[row.status]})`));
    }
    if (row && row.prLabel) {
      const state = PR_STATE_LABEL[row.prState] || (row.prState || "").toLowerCase();
      const pr = el("a", null, row.prLabel + (state ? ` (${state})` : ""));
      pr.href = row.prHref; pr.target = "_blank"; pr.rel = "noopener";
      pair.append(pr);
    } else {
      pair.append(el("span", "ref-none", "chưa có PR"));
    }
    line.append(pair);
  });
  return line;
}

function assignCard(a, byTicket) {
  const card = el("div", "assign");
  const top = el("div", "assign-top");
  top.append(pill(PRIORITY_TONE[a.priority] || "", a.priority || "—"));
  top.append(el("span", "assign-title", a.title));
  top.append(pill(a.status === "blocked" ? "on-ink" : "", ASSIGN_STATUS_LABEL[a.status] || a.status));
  if (a.at_risk) top.append(pill("on-blue", "trễ hạn"));
  if (a.stalled) top.append(pill("on-blue", "đứng im"));
  card.append(top);

  const refs = assignRefs(a, byTicket);
  if (refs) card.append(refs);

  // progress is null when there's no plan yet — draw no bar rather than a zero-width one,
  // which would read as "started and got nowhere".
  if (a.progress !== null && a.progress !== undefined) {
    const bar = el("div", "bar");
    const fill = el("div", "bar-fill");
    fill.style.width = Math.round(a.progress * 100) + "%";
    bar.append(fill);
    const steps = a.plan || [];
    const doneCount = steps.filter(s => s.state === "done").length;
    const row = el("div", "assign-progress");
    row.append(bar, el("span", "assign-meta", `${doneCount}/${steps.length} bước`));
    card.append(row);
  }

  (a.plan || []).forEach(s => {
    const row = el("div", "step step-" + s.state);
    row.append(el("span", "step-name", s.step || ""));
    row.append(el("span", "step-meta", [s.owner, s.eta].filter(Boolean).join(" · ")));
    card.append(row);
  });

  if (a.note) card.append(el("div", "assign-note", a.note));
  return card;
}

function renderAssignments(rows) {
  const open = rows.filter(a => !["done", "cancelled"].includes(a.status));
  const panel = document.getElementById("assignments");
  const head = zoneHead("Việc đang giao");
  if (!open.length) {
    panel.replaceChildren(head, el("p", null, "Chưa có việc nào được giao — nhắn cho Manager để giao một kết quả."));
    return;
  }
  const byTicket = {};
  computeTickets(lastAdoTickets, lastData, lastEscalations).forEach(r => { byTicket[String(r.id)] = r; });
  panel.replaceChildren(head, ...open.map(a => cardOrError(a, x => assignCard(x, byTicket), "assign")));
}

async function pollEscalations() {
  let data, err;
  try {
    const res = await fetch("/api/escalations");
    data = await res.json();
    err = checkResponse(res, data);
  } catch (e) { err = e.message || "request failed"; }

  pollFailures.escalations = !!err;
  if (err) {
    const panel = document.getElementById("decisions");
    panel.classList.remove("has-signal");   // a failed fetch is unknown, never a stale signal
    panel.replaceChildren(
      zoneHead("Cần bạn quyết"),
      el("p", "empty err", "Không tải được: " + err));
    renderCounters(lastAssignments, lastEscalations.needs_human || [], pollFailures);
    return;
  }
  lastEscalations = data;
  renderDecisions(data.needs_human || []);
  renderCounters(lastAssignments, data.needs_human || [], pollFailures);
  renderTickets(computeTickets(lastAdoTickets, lastData, lastEscalations));
}

async function pollAssignments() {
  let data, err;
  try {
    const res = await fetch("/api/assignments");
    data = await res.json();
    err = checkResponse(res, data);
  } catch (e) { err = e.message || "request failed"; }

  pollFailures.assignments = !!err;
  if (err) {
    document.getElementById("assignments").replaceChildren(
      zoneHead("Việc đang giao"),
      el("p", "empty err", "Không tải được: " + err));
    renderCounters(lastAssignments, lastEscalations.needs_human || [], pollFailures);
    return;
  }
  lastAssignments = data;
  renderAssignments(lastAssignments);
  renderCounters(lastAssignments, lastEscalations.needs_human || [], pollFailures);
}

async function pollAdoTickets() {
  try {
    const res = await fetch("/api/ado-tickets");
    const data = await res.json();
    if (checkResponse(res, data)) return;
    lastAdoTickets = data;
    renderTickets(computeTickets(lastAdoTickets, lastData, lastEscalations));
    renderAssignments(lastAssignments);
  } catch (e) { /* leave the last-known backlog in place on a transient failure */ }
}

// Built once, on the first poll (success or failure), and never touched again — a poll tick can
// never rebuild the composer out from under whatever the operator is mid-typing because there is
// no rebuild path after the first mount, only renderChatLog() replacing #chat-log's own children.
function ensureChatShell() {
  if (document.getElementById("chat-log")) return;
  const panel = document.getElementById("manager-chat");

  const input = document.createElement("textarea");
  input.className = "chat-input";
  input.rows = 3;
  input.placeholder = "Giao việc, đổi ưu tiên, hỏi tiến độ…";
  input.setAttribute("aria-label", "Nhắn tin cho manager");
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendChat(input); }
  });
  const send = el("button", "btn primary", "Gửi");
  send.addEventListener("click", () => sendChat(input));

  const reset = el("button", "btn", "Phiên mới");
  reset.addEventListener("click", async () => {
    if (!confirm("Bắt đầu phiên manager mới? Lịch sử chat sẽ không được nạp lại.")) return;
    await fetch("/api/manager/reset", { method: "POST" });
  });

  const head = el("div", "chat-head");
  head.append(el("h2", null, "Manager"), reset);

  // Model + effort for the CHAT path only. The daemon's own ticks keep their configured
  // defaults: nobody is watching a tick, but a person is watching this spinner, and opus-5 at
  // max effort took four and a half minutes to answer one word.
  const prefs = el("div", "chat-prefs");
  const model = document.createElement("select");
  model.id = "chat-model";
  model.setAttribute("aria-label", "Model cho chat");
  const effort = document.createElement("select");
  effort.id = "chat-effort";
  effort.setAttribute("aria-label", "Mức effort cho chat");
  const note = el("span", "chat-prefs-note", "");
  prefs.append(model, effort, note);
  const log = el("div", "chat-log");
  log.id = "chat-log";
  const compose = el("div", "chat-compose");
  compose.append(input, send);
  panel.replaceChildren(head, prefs, log, compose);
  loadChatPrefs();
}

// Label the vocabularies the server owns; an unknown value still renders, as itself, rather
// than vanishing from a list the server is the authority on.
const MODEL_LABEL = {
  "claude-opus-5": "Opus 5",
  "claude-sonnet-5": "Sonnet 5",
  "claude-haiku-4-5-20251001": "Haiku 4.5",
  "claude-fable-5-1": "Fable 5.1",
};
const EFFORT_LABEL = { low: "Thấp", medium: "Vừa", high: "Cao", xhigh: "Rất cao", max: "Tối đa" };

function fillPrefSelect(sel, values, current, labels) {
  sel.replaceChildren(...values.map(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = labels[v] || v;
    return o;
  }));
  sel.value = current;
}

async function loadChatPrefs() {
  const model = document.getElementById("chat-model");
  const effort = document.getElementById("chat-effort");
  const note = document.querySelector(".chat-prefs-note");
  if (!model || !effort) return;
  let p;
  try {
    const res = await fetch("/api/manager/prefs");
    if (!res.ok) throw new Error(String(res.status));
    p = await res.json();
  } catch (e) {
    // Leave the selects empty and say so: a picker showing a default it never read would
    // claim a setting the server may not actually be using.
    if (note) note.textContent = "không đọc được cấu hình";
    return;
  }
  fillPrefSelect(model, p.models || [], p.model, MODEL_LABEL);
  fillPrefSelect(effort, p.efforts || [], p.effort, EFFORT_LABEL);
  const save = async () => {
    if (note) note.textContent = "đang lưu…";
    try {
      const res = await fetch("/api/manager/prefs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: model.value, effort: effort.value }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || String(res.status));
      if (note) note.textContent = "đã lưu";
      setTimeout(() => { if (note && note.textContent === "đã lưu") note.textContent = ""; }, 2000);
    } catch (e) {
      // Re-read rather than leave the select showing a choice the server rejected.
      if (note) note.textContent = "không lưu được: " + (e.message || e);
      loadChatPrefs();
    }
  };
  model.onchange = save;
  effort.onchange = save;
}

function sourceLabel(source) {
  return {
    "daemon:escalation": "escalation từ worker",
    "daemon:worker-finished": "worker vừa xong",
    "daemon:tick": "tự rà soát định kỳ",
  }[source] || source;
}

// role (cto/system/manager) picks the bubble side + base tint; msg-auto retints anything that
// isn't a direct reply to the CTO so proactive work (incl. the daemon's system-role wake message)
// stays visible instead of blending in as a silent aside. Chat text is untrusted model/worker
// output — textContent only, never innerHTML.
const SPEAKER = { cto: "CTO", manager: "Manager", system: "Hệ thống" };

function chatRow(e) {
  const auto = e.source !== "cto";
  const row = el("div", `msg msg-${e.role}` + (auto ? " msg-auto" : ""));
  const who = SPEAKER[e.role] || e.role;
  row.append(el("div", "msg-who", auto ? `${who} · ${sourceLabel(e.source)}` : who));
  row.append(el("div", "msg-text", e.text || ""));
  return row;
}

function renderChatLog(payload) {
  const log = document.getElementById("chat-log");
  if (!log) return;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const rows = (payload.entries || []).map(chatRow);
  if (payload.busy) rows.push(el("div", "msg-thinking", "Manager đang xử lý…"));
  // No history yet is not an error — invite the first message instead of a blank box.
  if (!rows.length) rows.push(el("div", "empty", "Chưa có tin nhắn nào — nhắn để giao việc, đổi ưu tiên, hoặc hỏi tiến độ."));
  log.replaceChildren(...rows);
  if (atBottom) log.scrollTop = log.scrollHeight;   // only follow new messages if already at the bottom
}

function renderChat(payload) {
  ensureChatShell();
  renderChatLog(payload);
}

async function sendChat(input) {
  const text = input.value.trim();
  if (!text) return;
  const btn = input.nextElementSibling;   // compose = [input, send] — the button is always the next sibling
  input.disabled = true;
  if (btn) btn.disabled = true;
  try {
    const res = await fetch("/api/manager/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(res.status === 503 ? "Manager đang bận, thử lại sau." : `Lỗi ${res.status}: ${body.error || ""}`);
      return;   // the typed text stays in the box so nothing is lost
    }
    input.value = "";
    pollChat();
  } catch (e) {
    alert("Không gửi được: " + (e.message || e));   // typed text stays in the box here too
  } finally {
    input.disabled = false;
    if (btn) btn.disabled = false;
  }
}

async function pollChat() {
  let data, err;
  try {
    const res = await fetch("/api/manager/chat");
    data = await res.json();
    err = checkResponse(res, data);
  } catch (e) { err = e.message || "request failed"; }

  pollFailures.chat = !!err;
  if (err) {
    // honest state, not a silently frozen panel — but never touch the composer itself here,
    // whether or not it's focused, so a stretch of poll failures can't cost typed text either.
    ensureChatShell();
    const row = el("div", "msg msg-error");
    row.append(el("div", "msg-text", "Không tải được chat: " + err));
    document.getElementById("chat-log").replaceChildren(row);
    return;
  }
  renderChat(data);
}

wireTicketFilters();

pollEscalations();
setInterval(pollEscalations, 2000);

pollAssignments();
setInterval(pollAssignments, 2000);

pollChat();
setInterval(pollChat, 2000);

pollTasks();
setInterval(pollTasks, 2000);

pollAdoTickets();
setInterval(pollAdoTickets, 5000);
</script>
</body>
